# Active profile (override with -Dspring.profiles.active=prod on Render)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# MySQL driver (common)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Allow data.sql to run after JPA creates the schema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Exception handling
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# JWT
jwt.secret=${JWT_SECRET:MySuperSecretKeyForJWTThatIsAtLeast32Bytes!}
jwt.access-expiration-ms=${JWT_ACCESS_EXP:60000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXP:120000}

